var dec=function(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)});};
document.getElementById('f').addEventListener('submit',async function(ev){
  ev.preventDefault();
  var b=document.getElementById('b'),e=document.getElementById('e'),pw=document.getElementById('p').value;
  e.textContent='';b.disabled=true;b.textContent='Dechiffrement...';
  try{
    var enc=new TextEncoder();
    var base=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey(
      {name:'PBKDF2',salt:dec(DATA.salt),iterations:DATA.iter,hash:'SHA-256'},
      base,{name:'AES-GCM',length:256},false,['decrypt']);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:dec(DATA.iv),tagLength:128},key,dec(DATA.ct));
    var html=new TextDecoder().decode(pt);
    try{sessionStorage.setItem('unlocked','1');}catch(_){}
    document.open();document.write(html);document.close();
  }catch(err){
    b.disabled=false;b.textContent='Dechiffrer';
    e.textContent='Mot de passe incorrect.';
    document.getElementById('p').select();
  }
});
